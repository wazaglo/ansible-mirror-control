---
- name: Update apt-mirror repository sync
  hosts: mirror
  become: yes
  gather_facts: yes

  vars:
    apt_mirror_bin: /usr/bin/apt-mirror
    apt_mirror_conf: /etc/apt/mirror.list

  tasks:
    - name: Verify apt-mirror is installed
      stat:
        path: "{{ apt_mirror_bin }}"
      register: apt_mirror_stat

    - name: Fail if apt-mirror is not installed
      fail:
        msg: "apt-mirror not found at {{ apt_mirror_bin }}. Install it first."
      when: not apt_mirror_stat.stat.exists

    - name: Verify mirror.list exists
      stat:
        path: "{{ apt_mirror_conf }}"
      register: mirror_conf_stat

    - name: Fail if mirror.list is missing
      fail:
        msg: "Mirror config not found at {{ apt_mirror_conf }}."
      when: not mirror_conf_stat.stat.exists

    - name: Run apt-mirror sync
      command: "{{ apt_mirror_bin }} {{ apt_mirror_conf }}"
      register: mirror_update
      changed_when: '"0 bytes" not in mirror_update.stdout'
      failed_when:
        - mirror_update.rc != 0
        - '"ERROR" in mirror_update.stderr'
      when: apt_mirror_stat.stat.exists and mirror_conf_stat.stat.exists

    - name: Display sync summary
      debug:
        msg: "{{ (mirror_update.stdout_lines | default([]))[-5:] }}"
      when: mirror_update.changed
