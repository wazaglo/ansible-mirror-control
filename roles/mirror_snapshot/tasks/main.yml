---
- name: Validate snapshot_date format (YYYY-MM-DD)
  fail:
    msg: "Invalid snapshot_date format. Expected YYYY-MM-DD (e.g., 2026-03-30)."
  when: not snapshot_date is regex("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")
  tags: [snapshot, validation]

- name: Ensure snapshots web directory exists
  file:
    path: "{{ web_snapshots }}"
    state: directory
    mode: '0755'
    owner: "{{ snapshot_owner }}"
    group: "{{ snapshot_group }}"
  tags: [snapshot, setup]

- name: Snapshot main Debian repo with hard links
  command: cp -al "{{ mirror_root }}/deb.debian.org/debian" "{{ web_snapshots }}/debian-{{ snapshot_date }}"
  args:
    creates: "{{ web_snapshots }}/debian-{{ snapshot_date }}"
  changed_when: false
  tags: [snapshot, link]

- name: Snapshot Debian security repo with hard links
  command: cp -al "{{ mirror_root }}/deb.debian.org/debian-security" "{{ web_snapshots }}/debian-security-{{ snapshot_date }}"
  args:
    creates: "{{ web_snapshots }}/debian-security-{{ snapshot_date }}"
  changed_when: false
  tags: [snapshot, link]

- name: Show the snapshot date for clients
  debug:
    msg: "Ready: Snapshot '{{ snapshot_date }}' created at {{ web_snapshots }}/debian-{{ snapshot_date }}"
  tags: [snapshot, debug]
